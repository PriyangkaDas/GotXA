services:
 

  # CACHE & MESSAGE BROKER
 

  
  redis:
    image: redis:7-alpine
    container_name: radisCache
    networks:
      - gotxa-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "6379"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

 

  # DATABASES
 

  
  siem-postgres:
    image: postgres:15-alpine
    container_name: Database
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-siem_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-siem_db}
    volumes:
      - siem-db-data:/var/lib/postgresql/data
    networks:
      - gotxa-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siem_user -d siem_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    command:
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "shared_buffers=256MB"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

 

  # BACKEND API SERVER
 

  
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: SoC
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      SIEM_TZ_OFFSET_MINUTES: "330"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      FLASK_ENV: production
      DEBUG: 'False'
      LOG_LEVEL: INFO
      REPORTS_DIR: /app/reports
      COLLECTOR_INGEST_TOKEN: ${COLLECTOR_INGEST_TOKEN:?Set COLLECTOR_INGEST_TOKEN in .env}
      SOAR_REAL_MODE: ${SOAR_REAL_MODE:-false}
    depends_on:
      siem-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gotxa-net
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - reports-data:/app/reports
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1.5G
        reservations:
          cpus: '1'
          memory: 1G
  

  # CELERY WORKER (Background Tasks & Report Generation)
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: celery-worker
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      FLASK_ENV: production
      LOG_LEVEL: INFO
      REPORTS_DIR: /app/reports
    depends_on:
      siem-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - gotxa-net
    volumes:
      - ./backend:/app
      - reports-data:/app/reports
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.75'
          memory: 512M

  log-collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
    container_name: gotxa-log-collector
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      SIEM_INGRESS_URL: http://backend:5000/api/ingest/events
      COLLECTOR_INGEST_TOKEN: ${COLLECTOR_INGEST_TOKEN:?Set COLLECTOR_INGEST_TOKEN in .env}
      COLLECTOR_PORT: "5006"
    volumes:
      - ./logs:/logs:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gotxa-net
    expose:
      - "5006"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  ot-plc-refinery-1:
    build:
      context: .
      dockerfile: Dockerfile.plc
    container_name: ot-plc-refinery-1
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      AGENT_NAME: ot-plc-refinery-1
      MODBUS_PORT: "5003"
    networks:
      - gotxa-net
    volumes:
      - ./logs:/logs
    expose:
      - "5003"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  ot-plc-refinery-2:
    build:
      context: .
      dockerfile: Dockerfile.plc
    container_name: ot-plc-refinery-2
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      AGENT_NAME: ot-plc-refinery-2
      MODBUS_PORT: "5004"
    networks:
      - gotxa-net
    volumes:
      - ./logs:/logs
    expose:
      - "5004"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  scada-gateway:
    build:
      context: .
      dockerfile: Dockerfile.scada
    container_name: ot-scada-gateway
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      SIEM_INGRESS_URL: http://backend:5000/api/ingest/events
      SIEM_INGEST_URL: http://backend:5000/api/ingest/events
      COLLECTOR_INGEST_TOKEN: ${COLLECTOR_INGEST_TOKEN:?Set COLLECTOR_INGEST_TOKEN in .env}
      PLC_REFINERY_1_HOST: ${PLC_REFINERY_1_HOST:-ot-plc-refinery-1}
      PLC_REFINERY_2_HOST: ${PLC_REFINERY_2_HOST:-ot-plc-refinery-2}
    depends_on:
      backend:
        condition: service_healthy
      ot-plc-refinery-1:
        condition: service_started
      ot-plc-refinery-2:
        condition: service_started
    networks:
      - gotxa-net
    volumes:
      - ./logs:/logs
    expose:
      - "5002"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M


 

  # FRONTEND WEB SERVERS

  siem-soar-frontend:
    build:
      context: .
      dockerfile: webservers/siem-soar-frontend/Dockerfile
    container_name: siem-soar-frontend
    networks:
      - gotxa-net
    depends_on:
      - backend
    volumes:
      - siem-frontend-data:/app/frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    expose:
      - "80"
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  corp-portal-frontend:
    build:
      context: .
      dockerfile: webservers/corp-portal-frontend/Dockerfile
    container_name: corp-portal-frontend
    networks:
      - gotxa-net
    depends_on:
      - backend
    volumes:
      - corp-frontend-data:/app/frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    expose:
      - "80"
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  scada-frontend:
    build:
      context: .
      dockerfile: webservers/scada-frontend/Dockerfile
    container_name: scada-frontend
    networks:
      - gotxa-net
    depends_on:
      - backend
    volumes:
      - scada-frontend-data:/app/frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    expose:
      - "80"
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

 

  # API GATEWAY / REVERSE PROXY
 

  
  api-gateway:
    build:
      context: .
      dockerfile: webservers/api-gateway/Dockerfile
    container_name: Frontend
    networks:
      - gotxa-net
    depends_on:
      - backend
      - siem-soar-frontend
      - corp-portal-frontend
      - scada-frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=Asia/Kolkata
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M


 

  # RED TEAM / PENETRATION TESTING MACHINE
 


  new-machine:
    build:
      context: ./New_Machine
      dockerfile: Dockerfile
    container_name: New_Machine
    stdin_open: true
    tty: true
    networks:
      - gotxa-net
    depends_on:
      - backend
      - siem-postgres
      - api-gateway
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - ./New_Machine:/workspace
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    command: /bin/bash
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M


# ============================================================================
# VOLUMES
# ============================================================================

volumes:
  siem-db-data:
    driver: local
  siem-frontend-data:
    driver: local
  corp-frontend-data:
    driver: local
  scada-frontend-data:
    driver: local
  reports-data:
    driver: local

# ============================================================================
# NETWORKS
# ============================================================================

networks:
  gotxa-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/16

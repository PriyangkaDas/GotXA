user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=app_limit:10m rate=20r/s;

    # Upstream backends
    upstream backend {
        server backend:5000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream siem_soar {
        server siem-soar-frontend:80 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream corp_portal {
        server corp-portal-frontend:80 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream scada {
        server scada-frontend:80 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 100M;

        location /health {
            access_log off;
            return 200 "gateway:healthy\n";
            add_header Content-Type text/plain;
        }

        location /status {
            access_log off;
            return 200 "{\"status\": \"running\"}";
            add_header Content-Type application/json;
        }

        # SCADA's prebuilt dashboard references these machine images from the
        # origin root. Route them to its dedicated frontend service.
        location = /r1_heater.jpg {
            proxy_pass http://scada/r1_heater.jpg;
        }

        location = /r2_flow.jpg {
            proxy_pass http://scada/r2_flow.jpg;
        }

        location / {
            limit_req zone=app_limit burst=30 nodelay;
            proxy_pass http://siem_soar;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_buffering off;
        }

        location = /corp {
            return 301 /corp/;
        }

        location /corp/ {
            limit_req zone=app_limit burst=30 nodelay;
            proxy_pass http://corp_portal/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
        }

        location = /corp_portal {
            return 301 /corp_portal/;
        }

        location /corp_portal/ {
            limit_req zone=app_limit burst=30 nodelay;
            proxy_pass http://corp_portal/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
        }

        location = /scada {
            return 301 /scada/;
        }

        location /scada/ {
            limit_req zone=app_limit burst=30 nodelay;
            proxy_pass http://scada/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
        }

        location = /scada_dashboard {
            return 301 /scada_dashboard/;
        }

        location /scada_dashboard/ {
            limit_req zone=app_limit burst=30 nodelay;
            proxy_pass http://scada/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
        }

        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }

        location /api/health {
            access_log off;
            proxy_pass http://backend/health;
        }

        location /404 {
            return 404 "{\"error\": \"not_found\", \"message\": \"Resource not found\"}";
            add_header Content-Type application/json;
        }

        error_page 404 /404;
    }
}
